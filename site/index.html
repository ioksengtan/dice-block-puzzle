<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#efe6d6" />
    <title>骰陣拼圖</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="drag-layer" hidden></div>
    <main class="app">
      <header class="top">
        <div class="titles">
          <h1>骰陣拼圖</h1>
          <p class="lede">擲七顆骰子，用九塊拼圖填滿棋盤。</p>
        </div>
        <p class="timer" id="timer">時間：0 秒</p>
      </header>

      <div class="modes" role="group" aria-label="遊戲模式">
        <button type="button" id="mode-daily" aria-pressed="true">每日一題</button>
        <button type="button" id="mode-random" aria-pressed="false">隨機模式</button>
      </div>
      <p class="daily-date" id="daily-date" hidden></p>
      <p class="record" id="record" hidden></p>

      <div class="actions">
        <button type="button" class="primary" id="again">再玩一次</button>
        <button type="button" class="secondary" id="flip">翻面</button>
        <button type="button" class="secondary share" id="share" hidden>複製分享文字</button>
      </div>

      <section class="dice-section" aria-labelledby="dice-heading">
        <h2 id="dice-heading">骰子結果</h2>
        <ol class="dice" id="dice"></ol>
      </section>

      <section class="board-section" aria-label="棋盤">
        <div class="board-grid" id="board"></div>
      </section>

      <p class="hint">拖曳拼圖到棋盤，點一下旋轉，按翻面更換方向。</p>
      <p class="selection" id="selection">尚未選取拼圖</p>
      <p class="message" id="message"></p>

      <section class="tray-section" aria-labelledby="tray-heading">
        <h2 id="tray-heading">拼圖</h2>
        <div class="tray" id="tray"></div>
      </section>
    </main>
    <p class="sr" id="announce" aria-live="polite"></p>
    <script type="module" src="game.js"></script>
  </body>
</html>
